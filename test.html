<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @property --degree {
            syntax: '<angle>';
            inherits: false;
            initial-value: -270deg;
        }
        @property --color {
            syntax: '<color>';
            inherits: false;
            initial-value: red;
        }
        body {
            --degree: -270deg;
            --color: red;
            width: 100vw;
            height: 100dvh;
            background: conic-gradient(from var(--degree), var(--color), transparent);
            transition: --degree 0.5s, --color 0.5s;
        }
        body:hover {
            --color: transparent;
            --degree: 90deg;
        }

    </style>
</head>
<body>
    
</body>
</html>
