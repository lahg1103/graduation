<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 | Leslie Hurtado Graduation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="confettiCanvas"></canvas>
    <div class="main-gradient"></div>
    <div class="cap-wrapper">
        <div class="cap">
            <div class="tassel"><img src="tassel.png"></div>
            <div class="button"></div> 
        </div>
    </div>
    <main lang="es" class="hidden texgyretermes">
        <img src="cap.png" class="grad-cap">
        <h1 class="invite">Te invito a la ceremonia de graduación de</h1>
        <h1 class="sloopscript name">Leslie <br>Hurtado</h1>
        <div>
            <h2 class="major">Ingeniería en computacion</h2>
            <p>Clase de 2026</p>
        </div>

        <div class="date-container">
            <p>sabado</p>
            <p class="day">12</p>
            <p>dic.</p>
            <p class="time"> 9AM</p>
        </div>
        <p class="location">
            Bert Odgen Arena, Edinburg TX
        </p>
            
    <div class="map">
        <iframe src="https://www.google.com/maps/embed/v1/place?key=AIzaSyDkkZ6qd8WyY9dMC-SFalkd2mZZ0Jk11DU&q=Bert+Ogden+Arena,Edinburg+Texas&maptype=satellite"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <img src="diploma.png" class="diploma"> 
        
    </main>
    <script src="script.js"></script>
</body>
</html>
